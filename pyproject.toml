[project]
name = "terror-ps1"
version = "0.7.0"
description = "Terror em primeira pessoa numa floresta low poly estilo PS1: o vulto so anda no escuro."
requires-python = ">=3.11"
license = { text = "MPL-2.0" }
dependencies = [
    "pygame-ce>=2.5",
    "numpy>=1.26",
    "moderngl>=5.10",
    # a engine ECS compartilhada (repo irmao; em dev: pip install -e ../OuroborosEngine)
    "ouroboros-engine @ git+https://github.com/EzioMilanoX/OuroborosEngine.git",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "pyinstaller>=6"]

[tool.ruff]
line-length = 145
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
"*.spec" = ["F821"]  # SPECPATH, Analysis, EXE... sao injetados pelo PyInstaller
"terror_ps1/malhas.py" = ["B023"]  # a funcao interna do icosaedro roda dentro do proprio laco

[tool.pytest.ini_options]
testpaths = ["tests"]
